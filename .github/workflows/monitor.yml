
name: Oomotoya Egg Alert

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oomotoya-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      
      - name: Diagnose Python environment
        run: |
          echo "Python executable:"
          which python
          python --version

          echo "Playwright installation:"
          python -m pip show playwright

          echo "Import test:"
          python -c "import playwright.sync_api; print('Playwright import OK')"

          echo "Working directory:"
          pwd

          echo "Monitor file:"
          ls -l monitor.py


      - name: Check posts and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified_posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notified post IDs"
            git push
          fi
